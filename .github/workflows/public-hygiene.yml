name: public-hygiene

on:
  push:
    branches: [main]
  pull_request:

# Deliberately a workflow of its own rather than a job inside another workflow:
#
# * This gate scans tracked files at the checked-out commit (excluding the
#   allowlist file, binary files, and vendor/** paths) and finishes in seconds.
#   It should be the first thing to go red, and it should still report when other
#   workflows are queued or cancelled.
jobs:
  planning-identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 1 is enough: the gate scans tracked files at this commit,
      # excluding the allowlist file, binary files, and vendor/** paths.
      - uses: actions/checkout@v4

      # The gate's own regression test runs FIRST. A hygiene gate fails silently
      # in both directions — it can stop matching, or start matching honest
      # prose — so "the gate still works" has to be checked before "the tree is
      # clean" means anything.
      - name: hygiene gate self-test
        run: ./scripts/check-public-hygiene-selftest.sh

      # The gate scans tracked files at the checked-out commit (excluding the
      # allowlist file, binary files, and vendor/** paths), not history, commit
      # messages, or pull-request text.
      - name: private planning identifiers
        run: ./scripts/check-public-hygiene.sh
